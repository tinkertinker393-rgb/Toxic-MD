name: WhatsApp Bot Runner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Start Bot with Auto-Restart
        run: |
          # The "|| true" prevents GitHub from failing the whole job when the bot crashes
          while true; do
            echo "Starting bot with node index.js..."
            node index.js || true
            echo "Bot crashed or stopped. Restarting in 10 seconds..."
            sleep 10
          done
        env:
          PREFIX: '.'
          PRESENCE: 'online'
          OWNER_NUMBER: '254746404008'
          SESSION: ${{ secrets.SESSION }}
          AUTO_READ_STATUS: 'yes'
